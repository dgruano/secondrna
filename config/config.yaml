# Secondarna Pipeline Configuration
# Default values for all configurable parameters

#################################################
# PATHS (must be filled)
#################################################
annotation_file: null  # Optional BED file with feature annotations
group_annotation_file: "/mnt/cbib/LNClassifier/paper/results/gencode.v47.common.cdhit.cv/tables/gencode.v47.common.cdhit.cv_binary_class_table.tsv"  # BED file for grouping transcripts
final_partners_dirs:
  - "/mnt/cbib/LNClassifier/RNA_ScanFold2.0"
final_partners_output: "results/gencode.v48/scanfold_final_partners_stats.tsv"

#################################################
# SAMPLES (must be filled)
#################################################
samples:
  - "gencode.v47"  # FASTA basenames under resources/ processed by the default target

#################################################
# DEFAULTS (can remain unchanged)
#################################################
# Batch Processing Parameters
batch_size: 1000  # Sequences per batch for rG4detector
scanfold_oversized_max_len: 20000  # Sequences longer than this (nt) are routed to the oversized pipeline at split time
scanfold_retry_subbatch_size: 100  # Sub-batch size when retrying incomplete batches

# FinalPartners Summarization (standalone, outside main DAG)
final_partners_n_bins: 10

# Summarization Parameters
peak_threshold: 1.56  # Score threshold for simple peak counting (rg4_count_peaks)
threshold_low: 1.0  # Score threshold for candidate rG4 peaks
threshold_high: 2.0  # Score threshold for high-confidence rG4 peaks
min_peak_prominence: 0.3  # Minimum peak prominence for peak calling
min_peak_width: 20  # Minimum peak width in nucleotides

# Visualization Parameters
viz_output_dir: "results/{sample}/viz"  # Output directory root for visualizations
viz_plots: "distributions ranking details comparison"  # Plot types to generate
viz_format: "both"  # Output format: static, interactive, or both
viz_top_n: 20  # Number of top transcripts for ranking plots
viz_metric: "top_peak_score"  # Ranking metric (top_peak_score, max_score, n_peaks_above_high, rg4_density_per_kb)
viz_dpi: 300  # DPI for PNG files
viz_figsize: "10x6"  # Figure size as "WxH"
viz_class_col: "real"  # Column name for class labels
viz_transcript_detail: null  # Single transcript ID for detail view
viz_filter: null  # Filter string (e.g., "n_peaks_above_high > 0")

# Execution Parameters
profile: "profiles/default"  # SLURM configuration profile
cores: 4  # CPU cores for local execution (when not using SLURM)
max_jobs: 100  # Maximum concurrent SLURM jobs
