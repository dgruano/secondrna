default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.5.1
    hooks:
      - id: black
  - repo: https://github.com/pycqa/isort
    rev: 9.0.0a3  # Stable with black profile support
    hooks:
      - id: isort
        name: isort (python)
        args: [--profile, black, --filter-files]  # Filter-files avoids reprocessing
  - repo: local
    hooks:
      - id: nbstripout
        name: nbstripout with keep-output
        entry: python -m nbstripout --keep-output $@
        language: system
        files: \.ipynb$

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, chore, docs, test, ci, refactor, perf, style, build, revert, WIP]
